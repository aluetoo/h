<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Présentation</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body, html {
      height: 100%;
      width: 100%;
      overflow: hidden;
      background-color: #111111;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    /* Conteneur qui masque la barre du bas et la bordure orange */
    .cadre-presentation {
      position: fixed;
      top: -2px;
      left: -2px;
      width: calc(100% + 4px);
      height: calc(100% + 38px); /* Rogne les ~36px de la barre du bas de Microsoft */
      overflow: hidden;
      z-index: 1;
    }

    iframe {
      width: 100%;
      height: 100%;
      border: none;
      display: block;
    }

    /* Barre flottante en haut à droite */
    .barre-haut-droite {
      position: fixed;
      top: 14px;
      right: 16px;
      z-index: 100;
      display: flex;
      align-items: center;
      gap: 8px;
      background: rgba(20, 20, 20, 0.78);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      padding: 6px 12px;
      border-radius: 8px;
      border: 1px solid rgba(255, 255, 255, 0.15);
      color: #ffffff;
      font-size: 13px;
      user-select: none;
      transition: opacity 0.3s ease;
    }

    .barre-haut-droite button {
      background: transparent;
      border: none;
      color: #ffffff;
      cursor: pointer;
      padding: 4px 7px;
      border-radius: 5px;
      font-size: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.2s;
    }

    .barre-haut-droite button:hover {
      background: rgba(255, 255, 255, 0.18);
    }

    .compteur {
      font-variant-numeric: tabular-nums;
      font-weight: 500;
      padding: 0 4px;
      letter-spacing: 0.5px;
      color: #e5e5e5;
    }

    .separateur {
      width: 1px;
      height: 16px;
      background: rgba(255, 255, 255, 0.2);
      margin: 0 2px;
    }
  </style>
</head>
<body>

  <!-- Contrôles tout en haut à droite -->
  <div class="barre-haut-droite">
    <button id="btn-prev" title="Diapositive précédente (Flèche gauche)">◀</button>
    <span class="compteur" id="affichage-compteur">1 / 15</span>
    <button id="btn-next" title="Diapositive suivante (Flèche droite)">▶</button>
    <div class="separateur"></div>
    <button id="btn-fullscreen" title="Plein écran">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3m0 18h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3"/>
      </svg>
    </button>
  </div>

  <!-- Visionneuse rognée -->
  <div class="cadre-presentation">
    <iframe 
      id="visionneuse-ppt"
      allowfullscreen="true" 
      mozallowfullscreen="true" 
      webkitallowfullscreen="true">
    </iframe>
  </div>

  <script>
    // --- CONFIGURATION ---
    const nomDuFichier = "diaporama.pptx"; // Vérifiez que c'est bien le nom de votre fichier sur GitHub
    const totalDiapos = 15;                // Nombre total de diapositives
    // ---------------------

    // Chargement de la présentation Microsoft
    const dossierActuel = window.location.href.substring(0, window.location.href.lastIndexOf("/") + 1);
    const urlFichierPptx = encodeURIComponent(dossierActuel + nomDuFichier);
    const domaine = "https://view.officeapps." + "live.com/op/embed.aspx?src=";
    const iframe = document.getElementById("visionneuse-ppt");
    iframe.src = domaine + urlFichierPptx;

    // Gestion du compteur
    let diapoActuelle = 1;
    const affichageCompteur = document.getElementById("affichage-compteur");

    function majCompteur() {
      affichageCompteur.textContent = `${diapoActuelle} / ${totalDiapos}`;
    }

    function simulerTouche(codeTouche, keyName) {
      iframe.focus();
      // Tente d'envoyer la touche au clavier pour faire avancer PowerPoint
      window.dispatchEvent(new KeyboardEvent('keydown', { key: keyName, keyCode: codeTouche }));
    }

    document.getElementById("btn-next").addEventListener("click", () => {
      if (diapoActuelle < totalDiapos) {
        diapoActuelle++;
        majCompteur();
      }
      simulerTouche(39, "ArrowRight");
    });

    document.getElementById("btn-prev").addEventListener("click", () => {
      if (diapoActuelle > 1) {
        diapoActuelle--;
        majCompteur();
      }
      simulerTouche(37, "ArrowLeft");
    });

    // Synchronisation quand vous utilisez les flèches du clavier ou Espace
    document.addEventListener("keydown", (e) => {
      if (e.key === "ArrowRight" || e.key === " " || e.key === "PageDown") {
        if (diapoActuelle < totalDiapos) {
          diapoActuelle++;
          majCompteur();
        }
      } else if (e.key === "ArrowLeft" || e.key === "PageUp") {
        if (diapoActuelle > 1) {
          diapoActuelle--;
          majCompteur();
        }
      }
    });

    // Gestion du bouton Plein Écran
    document.getElementById("btn-fullscreen").addEventListener("click", () => {
      if (!document.fullscreenElement) {
        document.documentElement.requestFullscreen().catch((err) => {
          console.log("Erreur plein écran :", err);
        });
      } else {
        document.exitFullscreen();
      }
    });

    // Redonne le focus à la présentation après chargement pour que les flèches clavier marchent direct
    iframe.addEventListener("load", () => {
      iframe.focus();
    });
  </script>

</body>
</html>
