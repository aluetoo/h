<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Présentation</title>
  <style>
    body, html {
      margin: 0;
      padding: 0;
      height: 100%;
      width: 100%;
      overflow: hidden;
      background-color: #111111;
    }
    iframe {
      width: 100%;
      height: 100%;
      border: none;
      display: block;
    }
  </style>
</head>
<body>

  <iframe 
    id="visionneuse-ppt"
    allowfullscreen="true" 
    mozallowfullscreen="true" 
    webkitallowfullscreen="true">
  </iframe>

  <script>
    // 1. Indiquez ici le nom exact de votre fichier .pptx déposé sur GitHub
    const nomDuFichier = "diaporama.pptx";

    // 2. Détection automatique de l'adresse complète de votre fichier sur GitHub Pages
    const dossierActuel = window.location.href.substring(0, window.location.href.lastIndexOf("/") + 1);
    const urlFichierPptx = encodeURIComponent(dossierActuel + nomDuFichier);

    // 3. Assemblage automatique du lien de la visionneuse Microsoft
    const domaine = "https://view.officeapps." + "live.com/op/embed.aspx?src=";
    
    // 4. Chargement du diaporama
    document.getElementById("visionneuse-ppt").src = domaine + urlFichierPptx;
  </script>

</body>
</html>
